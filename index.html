<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secure Player</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: #0e1621;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
    }
    .box {
      background: #17212b;
      padding: 25px 20px;
      border-radius: 14px;
      border: 1px solid #2b5278;
      max-width: 450px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
    }
    p {
      color: #9ab3c9;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      background-color: #2481cc;
    }
    #player-container {
      display: none;
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
    }
    video {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      background: #000;
    }
    #status-box {
      display: none;
      margin-top: 15px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- লক ও এড দেখার স্ক্রিন -->
  <div class="box" id="lock-box">
    <h2>🎬 Video is Locked</h2>
    <p>Please view the sponsored ad for at least 15 seconds to unlock and watch this video in HD.</p>
    
    <button id="unlock-btn" onclick="startMonetagAd()">🔓 Watch Ad to Play Video</button>
    <div id="status-box"></div>
  </div>

  <!-- হাই-সিকিউরিটি ভিডিও প্লেয়ার -->
  <div id="player-container">
    <video id="videoPlayer" controls playsinline controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false;">
      <source id="videoSource" src="" type="video/mp4">
      Your device does not support this video.
    </video>
    <p style="color: #27ae60; font-size: 13px; margin-top: 10px;">🔒 Protected Stream • Download & Forwarding Disabled</p>
  </div>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || (e.ctrlKey && e.keyCode == 85)) return false;
    };

    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const videoCode = urlParams.get('v');

    const MONETAG_LINK = "https://omg10.com/4/11942237";

    // নতুন বটের ইউজারনেম সেট করা হয়েছে
    const botUsername = "my_videostorage4_bot";

    // ডেভেলপার সেফটি: আপনার আইডি (6645146172)
    const currentUserId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
    const isDeveloper = (currentUserId === 6645146172);

    let adOpenedTime = null;
    let isWatching = false;

    function startMonetagAd() {
      if (isDeveloper) {
        unlockAndPlay();
        return;
      }

      adOpenedTime = Date.now();
      isWatching = true;

      window.Telegram.WebApp.openLink(MONETAG_LINK);

      document.getElementById('unlock-btn').style.display = 'none';
      const statusBox = document.getElementById('status-box');
      statusBox.style.display = 'block';
      statusBox.innerHTML = `
        <div style="background: #2b527833; border: 1px dashed #2481cc; padding: 12px; border-radius: 8px;">
          <p style="color: #f39c12; font-weight: bold; margin: 0;">
            ⏳ Ad is open! Stay on the ad page for at least 15 seconds.<br>
            <span style="font-size: 12px; color: #bbb;">Do NOT close or press back early!</span>
          </p>
        </div>
      `;
    }

    function onUserReturn() {
      if (!isWatching || !adOpenedTime) return;

      const timeSpent = Math.floor((Date.now() - adOpenedTime) / 1000);

      if (timeSpent < 15) {
        isWatching = false;
        adOpenedTime = null;

        const statusBox = document.getElementById('status-box');
        statusBox.style.display = 'block';
        statusBox.innerHTML = `
          <div style="background: #e74c3c22; border: 1px solid #e74c3c; padding: 12px; border-radius: 8px;">
            <p style="color: #e74c3c; font-weight: bold; margin: 0 0 6px 0;">
              ❌ Ad Not Completed!
            </p>
            <p style="font-size: 13px; color: #ff9999; margin: 0;">
              You stayed for only ${timeSpent}s. You must stay on the ad page for at least 15 seconds.
            </p>
          </div>
        `;

        const btn = document.getElementById('unlock-btn');
        btn.innerText = "🔄 Watch Ad Again (15s Required)";
        btn.style.display = "block";

      } else {
        isWatching = false;
        unlockAndPlay();
      }
    }

    function unlockAndPlay() {
      document.getElementById('lock-box').style.display = 'none';
      const playerContainer = document.getElementById('player-container');
      const player = document.getElementById('videoPlayer');
      const source = document.getElementById('videoSource');

      source.src = `https://files.catbox.moe/${videoCode}.mp4`;
      player.load();
      playerContainer.style.display = 'block';
      player.play();
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        onUserReturn();
      }
    });

    window.addEventListener("focus", () => {
      onUserReturn();
    });
  </script>
</body>
</html>
