<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Video</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #17212b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      background: #242f3d;
      padding: 30px 20px;
      border-radius: 14px;
      border: 1px solid #2b5278;
      max-width: 400px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
    }
    p {
      color: #9ab3c9;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .btn-ad {
      background-color: #2481cc;
    }
    .btn-claim {
      background-color: #27ae60;
      display: none;
    }
    #status-box {
      display: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎬 Video is Locked</h2>
    <p id="info-text">You must view the sponsored ad for at least 15 seconds to unlock your video.</p>
    
    <!-- বাটন: এড দেখার জন্য -->
    <button id="unlock-btn" class="btn-ad" onclick="startMonetagAd()">🔓 Watch Ad to Unlock Video</button>

    <!-- স্ট্যাটাস এবং ওয়ার্নিং বক্স -->
    <div id="status-box"></div>

    <!-- ভিডিও পাওয়ার সবুজ বাটন -->
    <button id="claim-btn" class="btn-claim" onclick="claimVideo()">✅ Verified! Get Your Video Now</button>
  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file');

    const MONETAG_LINK = "https://omg10.com/4/11942237";
    const botUsername = "myvideostorage1_bot";

    // ডেভেলপার আইডি: আপনার আইডিটি এখানে ১০০% সুরক্ষিত রাখা হয়েছে
    const currentUserId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
    const isDeveloper = (currentUserId === 6645146172);

    let adOpenedTime = null;
    let isWatching = false;

    function startMonetagAd() {
      // আপনি (ডেভেলপার) দেখলে সরাসরি ভিডিও যাবে, কোনো এড লোড হবে না
      if (isDeveloper) {
        alert("Developer mode: Delivering video...");
        claimVideo();
        return;
      }

      // এডে যাওয়ার আসল সময় রেকর্ড
      adOpenedTime = Date.now();
      isWatching = true;

      // Monetag এড ওপেন হবে
      window.Telegram.WebApp.openLink(MONETAG_LINK);

      // পেজে নোটিশ দেখানো
      document.getElementById('unlock-btn').style.display = 'none';
      const statusBox = document.getElementById('status-box');
      statusBox.style.display = 'block';
      statusBox.innerHTML = `
        <div style="background: #2b527833; border: 1px dashed #2481cc; padding: 12px; border-radius: 8px;">
          <p style="color: #f39c12; font-weight: bold; margin: 0;">
            ⏳ Ad is open! Stay on the ad page for at least 15 seconds.<br>
            <span style="font-size: 12px; color: #bbb;">Do NOT close or press back early!</span>
          </p>
        </div>
      `;
    }

    // ইউজার যখন এডের পেজ থেকে ব্যাক করে ফিরে আসবে
    function onUserReturn() {
      if (!isWatching || !adOpenedTime) return;

      const timeSpent = Math.floor((Date.now() - adOpenedTime) / 1000);

      // ইউজার যদি ১৫ সেকেন্ডের আগে ব্যাক করে ফেলে (ফাঁকিবাজি ধরা পড়লে)
      if (timeSpent < 15) {
        isWatching = false;
        adOpenedTime = null;

        const statusBox = document.getElementById('status-box');
        statusBox.style.display = 'block';
        statusBox.innerHTML = `
          <div style="background: #e74c3c22; border: 1px solid #e74c3c; padding: 12px; border-radius: 8px;">
            <p style="color: #e74c3c; font-weight: bold; margin: 0 0 6px 0;">
              ❌ Ad Not Completed!
            </p>
            <p style="font-size: 13px; color: #ff9999; margin: 0;">
              You stayed for only ${timeSpent}s. You must stay on the ad page for at least 15 seconds.
            </p>
          </div>
        `;

        // আবার চেষ্টা করার বাটন দেখাবে
        const btn = document.getElementById('unlock-btn');
        btn.innerText = "🔄 Watch Ad Again (15s Required)";
        btn.style.display = "block";

      } else {
        // ইউজার সফলভাবে পুরো ১৫ সেকেন্ড এডের পেজে ছিল
        isWatching = false;
        document.getElementById('status-box').style.display = 'none';
        document.getElementById('claim-btn').style.display = 'block';
      }
    }

    // এডের পেজ থেকে ফিরে আসার সাথে সাথে সেন্সর চালু হওয়া
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        onUserReturn();
      }
    });

    window.addEventListener("focus", () => {
      onUserReturn();
    });

    // ভিডিও নেওয়ার ফাংশন
    function claimVideo() {
      window.Telegram.WebApp.openTelegramLink(`https://t.me/${botUsername}?start=unlock_${fileId}`);
    }
  </script>
</body>
</html>
