<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Video</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #17212b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      background: #242f3d;
      padding: 30px 20px;
      border-radius: 14px;
      border: 1px solid #2b5278;
      max-width: 400px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
    }
    p {
      color: #9ab3c9;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      background-color: #2481cc;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    #timer-box {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #17212b;
      border-radius: 8px;
      border: 1px dashed #2481cc;
    }
    .timer-text {
      color: #f39c12;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎬 Video is Locked</h2>
    <p>To watch this video, please click the button below and view the sponsored ad. The video will be sent to your inbox automatically.</p>
    
    <button id="unlock-btn" onclick="startMonetagAd()">🔓 Watch Ad to Unlock Video</button>

    <div id="timer-box">
      <p class="timer-text" id="countdown-text">Ad Opened! Unlocking video in 5s...</p>
    </div>
  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file');

    // আপনার Monetag Direct Link
    const MONETAG_LINK = "https://omg10.com/4/11942237";
    const botUsername = "myvideostorage1_bot";

    // ডেভেলপার আইডি চেক (আপনার আইডি)
    const currentUserId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
    const isDeveloper = (currentUserId === 6645146172);

    function startMonetagAd() {
      // আপনি (ডেভেলপার) দেখলে কোনো এড লোড হবে না, সরাসরি আনলক হবে
      if (isDeveloper) {
        alert("Developer mode: Bypassing ad. Delivering video...");
        window.Telegram.WebApp.openTelegramLink(`https://t.me/${botUsername}?start=unlock_${fileId}`);
        return;
      }

      // সাধারণ দর্শকদের জন্য Monetag এড ওপেন হবে
      window.Telegram.WebApp.openLink(MONETAG_LINK);

      // টাইমার চালু হবে
      document.getElementById('unlock-btn').style.display = 'none';
      document.getElementById('timer-box').style.display = 'block';

      let timeLeft = 5;
      const timer = setInterval(() => {
        timeLeft--;
        document.getElementById('countdown-text').innerText = `Ad Opened! Unlocking video in ${timeLeft}s...`;

        if (timeLeft <= 0) {
          clearInterval(timer);
          // সময় শেষ হলে স্বয়ংক্রিয়ভাবে বটে ফেরত গিয়ে ভিডিও আনলক করবে
          window.Telegram.WebApp.openTelegramLink(`https://t.me/${botUsername}?start=unlock_${fileId}`);
        }
      }, 1000);
    }
  </script>
</body>
</html>
