<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Video</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body {
      background-color: #17212b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      background: #242f3d;
      padding: 30px 20px;
      border-radius: 14px;
      border: 1px solid #2b5278;
      max-width: 400px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
    }
    p {
      color: #9ab3c9;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      background-color: #2481cc;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎬 Video is Locked</h2>
    <p>To watch this video, please click the button below and watch a short ad completely. Once finished, the video will be delivered to your inbox.</p>
    <button onclick="watchAd()">🔓 Watch Ad to Unlock Video</button>
  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file');

    // ইউজারের আইডি চেক করা
    const currentUserId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
    
    // আপনার আইডি: 6645146172 (আপনি দেখলে টেস্ট এড, সাধারণ মানুষ দেখলে রিয়েল এড)
    const isDeveloper = (currentUserId === 6645146172);

    const AdController = window.Adsgram.init({ 
      blockId: "51341", 
      debug: isDeveloper 
    });

    function watchAd() {
      AdController.show().then((result) => {
        const botUsername = "myvideostorage1_bot";
        window.Telegram.WebApp.openTelegramLink(`https://t.me/${botUsername}?start=unlock_${fileId}`);
      }).catch((result) => {
        alert("Alert: " + (result.description || "You must watch the full ad to unlock the video!"));
      });
    }
  </script>
</body>
</html>
