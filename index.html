<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Video</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #17212b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      background: #242f3d;
      padding: 30px 20px;
      border-radius: 14px;
      border: 1px solid #2b5278;
      max-width: 400px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
    }
    p {
      color: #9ab3c9;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .btn-ad {
      background-color: #2481cc;
    }
    .btn-claim {
      background-color: #27ae60; /* সবুজ বাটন */
      display: none;
    }
    #timer-box {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #17212b;
      border-radius: 8px;
      border: 1px dashed #2481cc;
    }
    .timer-text {
      color: #f39c12;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎬 Video is Locked</h2>
    <p>Please click below and view the sponsored ad for at least 15 seconds to unlock your video.</p>
    
    <!-- Step 1: এড দেখার বাটন -->
    <button id="unlock-btn" class="btn-ad" onclick="startMonetagAd()">🔓 Watch Ad to Unlock Video (15s)</button>

    <!-- Step 2: ১৫ সেকেন্ডের টাইমার বক্স -->
    <div id="timer-box">
      <p class="timer-text" id="countdown-text">Ad Opened! Please wait 15s...</p>
    </div>

    <!-- Step 3: ১৫ সেকেন্ড পর প্রদর্শিত সবুজ বাটন -->
    <button id="claim-btn" class="btn-claim" onclick="claimVideo()">✅ Get Your Video Now</button>
  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file');

    const MONETAG_LINK = "https://omg10.com/4/11942237";
    const botUsername = "myvideostorage1_bot";

    // ডেভেলপার আইডি (আপনার জন্য টেস্ট বাইপাস)
    const currentUserId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
    const isDeveloper = (currentUserId === 6645146172);

    const WAIT_SECONDS = 15; // পুরো ১৫ সেকেন্ড অপেক্ষা বাধ্যতামূলক

    function startMonetagAd() {
      // আপনি (ডেভেলপার) দেখলে সরাসরি ভিডিও যাবে
      if (isDeveloper) {
        alert("Developer mode: Delivering video...");
        claimVideo();
        return;
      }

      // Monetag এড ওপেন হবে
      window.Telegram.WebApp.openLink(MONETAG_LINK);

      // বাটন লুকিয়ে টাইমার চালু হবে
      document.getElementById('unlock-btn').style.display = 'none';
      document.getElementById('timer-box').style.display = 'block';

      // রিয়েল টাইম ট্র্যাকিং (যাতে ব্যাক করলেও সময় চুরি করতে না পারে)
      const startTime = Date.now();

      const timer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const timeLeft = Math.max(0, WAIT_SECONDS - elapsed);

        if (timeLeft > 0) {
          document.getElementById('countdown-text').innerText = `Verifying ad... Please wait ${timeLeft}s`;
        } else {
          clearInterval(timer);
          // পুরো ১৫ সেকেন্ড শেষ হলে সবুজ বাটন সামনে আসবে
          document.getElementById('timer-box').style.display = 'none';
          document.getElementById('claim-btn').style.display = 'block';
        }
      }, 500);
    }

    // ভিডিও নেওয়ার ফাংশন
    function claimVideo() {
      window.Telegram.WebApp.openTelegramLink(`https://t.me/${botUsername}?start=unlock_${fileId}`);
    }
  </script>
</body>
</html>
